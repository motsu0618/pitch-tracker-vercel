<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>投手ストライク率計測アプリ - Pitch Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans JP', 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        /* Touch friendly active state animation */
        .btn-active:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        /* Custom scrollbar for mobile experience */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20 select-none">

    <!-- App Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-baseball-bat-ball text-red-500 text-xl"></i>
                <h1 class="text-lg font-bold tracking-tight">Pitch Strike Rate</h1>
            </div>
            <button id="addPitcherBtn" onclick="openAddPitcherModal()" class="bg-indigo-600 hover:bg-indigo-700 text-xs px-3 py-1.5 rounded-full font-medium transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-plus text-xs"></i> 投手追加
            </button>
        </div>
    </header>

    <!-- Main Container (Limited width for optimal smartphone view) -->
    <main class="max-w-md mx-auto px-3 py-3 space-y-4">

        <!-- VIEW 1: HOME & DASHBOARD -->
        <section id="viewDashboard" class="space-y-4">
            <!-- Pitcher Selector Dropdown / Cards -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
                <label for="pitcherSelect" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">
                    <i class="fa-solid fa-user-gear mr-1"></i> 対象投手を選択
                </label>
                <div class="flex gap-2">
                    <div class="relative flex-1">
                        <select id="pitcherSelect" onchange="onPitcherChange()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-bold text-slate-800 appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            <!-- JS populated options -->
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                            <i class="fa-solid fa-chevron-down text-sm"></i>
                        </div>
                    </div>
                    <button onclick="openDeletePitcherModal()" id="deletePitcherBtn" title="この投手を削除" class="shrink-0 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded-xl px-3.5 py-2.5 transition disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-red-50" disabled>
                        <i class="fa-solid fa-trash-can text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Filter Controls for Guidance / Analysis -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <i class="fa-solid fa-filter mr-1"></i> 期間・絞り込み
                    </span>
                    <button onclick="resetFilters()" class="text-xs text-indigo-600 hover:underline font-medium">全期間に戻す</button>
                </div>
                
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setPeriodFilter('all')" id="btnFilterAll" class="filter-btn bg-indigo-600 text-white text-xs font-bold py-2 px-1 rounded-xl transition text-center shadow-sm">全期間</button>
                    <button onclick="setPeriodFilter('month')" id="btnFilterMonth" class="filter-btn bg-slate-100 text-slate-600 text-xs font-bold py-2 px-1 rounded-xl transition text-center hover:bg-slate-200">今月</button>
                    <button onclick="setPeriodFilter('today')" id="btnFilterToday" class="filter-btn bg-slate-100 text-slate-600 text-xs font-bold py-2 px-1 rounded-xl transition text-center hover:bg-slate-200">本日</button>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div>
                        <label class="block text-[10px] text-slate-400 font-semibold mb-0.5">月指定</label>
                        <input type="month" id="monthPicker" onchange="onCustomDateChange('month')" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 font-medium">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-400 font-semibold mb-0.5">日指定</label>
                        <input type="date" id="datePicker" onchange="onCustomDateChange('date')" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-1.5 text-xs text-slate-700 font-medium">
                    </div>
                </div>
            </div>

            <!-- Stats Summary Chart Card -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                    <div>
                        <h2 id="currentPitcherName" class="text-lg font-bold text-slate-800">投手を選択してください</h2>
                        <p id="statsPeriodLabel" class="text-xs text-slate-400 font-medium">集計期間: 全期間</p>
                    </div>
                    <span id="totalPitchCountBadge" class="bg-slate-100 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-full border border-slate-200">0 投球</span>
                </div>

                <!-- Main Donut Chart for Strike Rate -->
                <div class="relative flex justify-center items-center py-2">
                    <div class="w-48 h-48 relative">
                        <canvas id="strikeRatioChart"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span class="text-xs text-slate-400 font-bold uppercase tracking-wider">ストライク率</span>
                            <span id="chartCenterRate" class="text-2xl font-black text-slate-800">0.0%</span>
                        </div>
                    </div>
                </div>

                <!-- Numeric Breakdown Cards -->
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div class="bg-red-50/70 border border-red-100 rounded-xl p-3 text-center">
                        <div class="text-xs font-bold text-red-600 mb-0.5 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span> ストライク
                        </div>
                        <div id="strikeCountText" class="text-xl font-black text-red-700">0 球</div>
                        <div id="strikePercentText" class="text-xs text-red-500 font-semibold">0.0%</div>
                    </div>
                    <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3 text-center">
                        <div class="text-xs font-bold text-blue-600 mb-0.5 flex items-center justify-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span> ボール
                        </div>
                        <div id="ballCountText" class="text-xl font-black text-blue-700">0 球</div>
                        <div id="ballPercentText" class="text-xs text-blue-500 font-semibold">0.0%</div>
                    </div>
                </div>
            </div>

            <!-- Pitch Type Stats Breakdown -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center justify-between">
                    <span><i class="fa-solid fa-chart-simple mr-1"></i> 球種別ストライク率</span>
                </h3>
                <div id="pitchTypeBreakdown" class="space-y-2.5">
                    <!-- Dynamic rendering of pitch types -->
                    <p class="text-xs text-slate-400 text-center py-2">データがありません</p>
                </div>
            </div>

            <!-- Pitch Log / Recent History -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">
                        <i class="fa-solid fa-clock-rotate-left mr-1"></i> 直近の投球履歴
                    </h3>
                    <button onclick="clearCurrentFilteredHistory()" class="text-[11px] text-red-500 hover:underline">履歴クリア</button>
                </div>
                <div id="pitchHistoryList" class="space-y-2 max-h-56 overflow-y-auto pr-1">
                    <!-- Dynamic pitch history -->
                </div>
            </div>
        </section>

        <!-- VIEW 2: REAL-TIME TRACKER (HIGHLY OPTIMIZED FOR ONE-HANDED TOUCH) -->
        <section id="viewTracker" class="hidden space-y-4">
            
            <!-- Pitcher Session Bar -->
            <div class="bg-slate-800 text-white rounded-2xl p-3 shadow-sm flex justify-between items-center">
                <div>
                    <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">計測中</div>
                    <div id="trackerPitcherName" class="text-base font-bold text-amber-400">未選択</div>
                </div>
                <div class="flex gap-2">
                    <button onclick="finishSession()" class="bg-red-600 hover:bg-red-700 active:bg-red-800 text-xs px-3 py-2 rounded-xl text-white font-bold transition flex items-center gap-1 shadow-md">
                        <i class="fa-solid fa-flag-checkered"></i> 計測終了
                    </button>
                    <button onclick="undoLastPitch()" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-500 text-xs px-3 py-2 rounded-xl text-slate-200 font-bold transition flex items-center gap-1 border border-slate-600">
                        <i class="fa-solid fa-rotate-left"></i> 1球戻す
                    </button>
                </div>
            </div>

            <!-- Live Session Quick Counters -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 grid grid-cols-3 gap-2 text-center">
                <div class="border-r border-slate-100 pr-1">
                    <span class="text-[10px] font-bold text-slate-400 block">総投球数</span>
                    <span id="sessionTotalCount" class="text-2xl font-black text-slate-800">0</span>
                </div>
                <div class="border-r border-slate-100 pr-1">
                    <span class="text-[10px] font-bold text-red-500 block">ストライク</span>
                    <span id="sessionStrikeCount" class="text-2xl font-black text-red-600">0</span>
                </div>
                <div>
                    <span class="text-[10px] font-bold text-blue-500 block">ボール</span>
                    <span id="sessionBallCount" class="text-2xl font-black text-blue-600">0</span>
                </div>
            </div>

            <!-- STEP 1: Pitch Type Selector (Big Thumb-friendly Tiles) -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-2">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                    <span class="bg-slate-800 text-white text-[10px] px-1.5 py-0.5 rounded mr-1">STEP 1</span> 球種を選択
                </label>
                <div id="pitchTypeButtons" class="grid grid-cols-3 gap-2">
                    <!-- Standard pitch types dynamically activated -->
                </div>
            </div>

            <!-- STEP 2: Main Strike / Ball Giant Tap Buttons -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">
                    <span class="bg-slate-800 text-white text-[10px] px-1.5 py-0.5 rounded mr-1">STEP 2</span> 判定を選択して記録
                </label>
                
                <div class="grid grid-cols-2 gap-3 h-44">
                    <!-- STRIKE BUTTON -->
                    <button onclick="recordPitch('strike')" class="btn-active bg-gradient-to-br from-red-500 to-rose-600 text-white rounded-2xl font-black shadow-lg shadow-red-500/20 flex flex-col justify-center items-center border-2 border-red-400 hover:brightness-105 active:scale-95 transition-all duration-75">
                        <span class="text-3xl tracking-widest">STRIKE</span>
                        <span class="text-xs font-medium text-red-100 mt-1"><i class="fa-solid fa-circle text-[8px] mr-1"></i>ストライク</span>
                    </button>

                    <!-- BALL BUTTON -->
                    <button onclick="recordPitch('ball')" class="btn-active bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-blue-500/20 flex flex-col justify-center items-center border-2 border-blue-400 hover:brightness-105 active:scale-95 transition-all duration-75">
                        <span class="text-3xl tracking-widest">BALL</span>
                        <span class="text-xs font-medium text-blue-100 mt-1"><i class="fa-solid fa-circle text-[8px] mr-1"></i>ボール</span>
                    </button>
                </div>
            </div>

            <!-- Last Pitch Feedback Toast -->
            <div id="lastPitchFeedback" class="bg-slate-900 text-white text-xs py-2 px-4 rounded-xl text-center font-medium opacity-0 transition-opacity duration-200 flex items-center justify-between">
                <span>直前の記録: <strong id="lastPitchDetails" class="text-amber-400">---</strong></span>
                <span class="text-[10px] text-slate-400">記録完了</span>
            </div>

        </section>

    </main>

    <!-- Bottom Navigation Bar for Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 z-50">
        <div class="max-w-md mx-auto grid grid-cols-2 h-16">
            <button onclick="switchView('dashboard')" id="navDashboardBtn" class="flex flex-col items-center justify-center text-indigo-600 font-bold transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[11px]">ダッシュボード</span>
            </button>
            <button onclick="switchView('tracker')" id="navTrackerBtn" class="flex flex-col items-center justify-center text-slate-400 font-bold hover:text-indigo-600 transition">
                <i class="fa-solid fa-baseball text-lg mb-0.5"></i>
                <span class="text-[11px]">投球計測</span>
            </button>
        </div>
    </nav>

    <!-- Modal: Add New Pitcher -->
    <div id="addPitcherModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="text-base font-bold text-slate-800">新規投手を登録</h3>
                <button onclick="closeAddPitcherModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <form onsubmit="handleAddPitcher(event)" class="space-y-3">
                <div>
                    <label for="newPitcherName" class="block text-xs font-bold text-slate-600 mb-1">投手名 *</label>
                    <input type="text" id="newPitcherName" required placeholder="例: 山田 太郎" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="newPitcherNumber" class="block text-xs font-bold text-slate-600 mb-1">背番号 (任意)</label>
                    <input type="text" id="newPitcherNumber" placeholder="例: 18" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeAddPitcherModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2.5 rounded-xl transition">キャンセル</button>
                    <button type="submit" class="w-1/2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-md transition">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Delete Pitcher Confirmation -->
    <div id="deletePitcherModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-1 text-xl">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">この投手を削除しますか?</h3>
                <p id="deletePitcherTargetName" class="text-sm font-bold text-red-600">---</p>
                <p class="text-xs text-slate-500 pt-1">この投手に紐づく投球記録もすべて削除されます。この操作は取り消せません。</p>
            </div>
            <div class="pt-2 flex gap-2">
                <button type="button" onclick="closeDeletePitcherModal()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold py-2.5 rounded-xl transition">キャンセル</button>
                <button type="button" onclick="confirmDeletePitcher()" id="confirmDeletePitcherBtn" class="w-1/2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-md transition">削除する</button>
            </div>
        </div>
    </div>
    <div id="finishSessionModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl w-full max-w-sm p-5 shadow-2xl space-y-4 animate-in fade-in zoom-in duration-200">
            <div class="text-center space-y-1">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-1 text-xl font-bold">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <h3 class="text-lg font-black text-slate-800">計測セッション完了</h3>
                <p id="summaryPitcherName" class="text-xs font-bold text-indigo-600">---</p>
            </div>

            <!-- Summary Card -->
            <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200/80 space-y-3 text-center">
                <div class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">本日の累積投球結果</div>
                <div id="summaryTotalPitch" class="text-3xl font-black text-slate-800">0 <span class="text-sm font-semibold text-slate-500">球</span></div>
                
                <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200">
                    <div class="bg-white p-2.5 rounded-xl border border-red-100 shadow-sm">
                        <span class="text-[10px] font-bold text-red-500 block">ストライク</span>
                        <span id="summaryStrikeCount" class="text-lg font-black text-red-600">0 球</span>
                        <span id="summaryStrikeRate" class="text-[10px] font-bold text-slate-400 block">0.0%</span>
                    </div>
                    <div class="bg-white p-2.5 rounded-xl border border-blue-100 shadow-sm">
                        <span class="text-[10px] font-bold text-blue-500 block">ボール</span>
                        <span id="summaryBallCount" class="text-lg font-black text-blue-600">0 球</span>
                        <span id="summaryBallRate" class="text-[10px] font-bold text-slate-400 block">0.0%</span>
                    </div>
                </div>
            </div>

            <button onclick="closeFinishSessionModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-bold py-3 rounded-xl shadow-md transition">
                ダッシュボードで確認する
            </button>
        </div>
    </div>

    <!-- Application JavaScript Logic with Cloud Persistence -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Default pitch types mapping
        const PITCH_TYPES = [
            { id: 'straight', name: 'ストレート', short: '直球', color: 'bg-slate-800 text-white' },
            { id: 'slider', name: 'スライダー', short: 'スライダー', color: 'bg-emerald-600 text-white' },
            { id: 'curve', name: 'カーブ', short: 'カーブ', color: 'bg-amber-600 text-white' },
            { id: 'fork', name: 'フォーク', short: 'フォーク', color: 'bg-purple-600 text-white' },
            { id: 'changeup', name: 'チェンジアップ', short: 'チェンジ', color: 'bg-teal-600 text-white' },
            { id: 'other', name: 'その他球種', short: 'その他', color: 'bg-slate-500 text-white' }
        ];

        // Global State variables
        window.pitchers = [];
        window.pitches = [];
        window.currentPitcherId = null;
        window.selectedPitchType = 'straight';
        window.currentFilter = { period: 'all', month: null, date: null };
        window.chartInstance = null;

        let db = null;
        let auth = null;
        const appId = 'pitch-tracker-app';

        const firebaseConfig = {
            apiKey: "AIzaSyB2bvCSYC6qkBiImDgvf8hC61CtUHo2-cI",
            authDomain: "pitcher-strike-rate-4c368.firebaseapp.com",
            projectId: "pitcher-strike-rate-4c368",
            storageBucket: "pitcher-strike-rate-4c368.firebasestorage.app",
            messagingSenderId: "421694405086",
            appId: "1:421694405086:web:6b3afc27f6332a0970854f"
        };

        // Initialize application and Firebase on window load
        window.onload = async function() {
            initPitchTypeButtons();
            setupChart();
            await initCloudStorage();
            renderPitcherDropdown();
            updateDashboard();
        };

        // Firebase Cloud Persistence Initialization
        async function initCloudStorage() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                await signInAnonymously(auth);

                // Subscribe to Pitchers Collection
                const pitchersCol = collection(db, 'artifacts', appId, 'public', 'data', 'pitchers');
                onSnapshot(pitchersCol, (snapshot) => {
                    window.pitchers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (!window.currentPitcherId && window.pitchers.length > 0) {
                        window.currentPitcherId = window.pitchers[0].id;
                    }
                    renderPitcherDropdown();
                    updateDashboard();
                    updateTrackerCounters();
                }, (err) => console.error("Pitchers listener error:", err));

                // Subscribe to Pitches Collection
                const pitchesCol = collection(db, 'artifacts', appId, 'public', 'data', 'pitches');
                onSnapshot(pitchesCol, (snapshot) => {
                    window.pitches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    updateDashboard();
                    updateTrackerCounters();
                }, (err) => console.error("Pitches listener error:", err));
            } catch (e) {
                console.error("Cloud storage connection error:", e);
            }
        }

        window.initPitchTypeButtons = function() {
            const container = document.getElementById('pitchTypeButtons');
            container.innerHTML = '';

            PITCH_TYPES.forEach(pt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `ptBtn_${pt.id}`;
                btn.onclick = () => selectPitchType(pt.id);
                
                const isSelected = pt.id === window.selectedPitchType;
                btn.className = `p-2.5 rounded-xl text-xs font-bold transition flex flex-col items-center justify-center border-2 btn-active ${
                    isSelected 
                        ? `${pt.color} border-slate-900 ring-2 ring-indigo-400 shadow-md` 
                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                }`;
                
                btn.innerHTML = `<span class="text-sm font-black">${pt.short}</span>`;
                container.appendChild(btn);
            });
        };

        window.selectPitchType = function(typeId) {
            window.selectedPitchType = typeId;
            initPitchTypeButtons();
            if (navigator.vibrate) navigator.vibrate(20);
        };

        window.setupChart = function() {
            const ctx = document.getElementById('strikeRatioChart').getContext('2d');
            window.chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['ストライク', 'ボール'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#ef4444', '#3b82f6'],
                        borderWidth: 3,
                        borderColor: '#ffffff',
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '72%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return ` ${context.label}: ${context.raw}球`;
                                }
                            }
                        }
                    }
                }
            });
        };

        window.renderPitcherDropdown = function() {
            const select = document.getElementById('pitcherSelect');
            const deleteBtn = document.getElementById('deletePitcherBtn');
            select.innerHTML = '';

            if (window.pitchers.length === 0) {
                select.innerHTML = '<option value="">(投手が登録されていません)</option>';
                if (deleteBtn) deleteBtn.disabled = true;
                return;
            }

            window.pitchers.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.name} ${p.number ? `(#${p.number})` : ''}`;
                if (p.id === window.currentPitcherId) opt.selected = true;
                select.appendChild(opt);
            });

            if (deleteBtn) deleteBtn.disabled = !window.currentPitcherId;

            const activePitcher = window.pitchers.find(p => p.id === window.currentPitcherId);
            if (activePitcher) {
                document.getElementById('currentPitcherName').textContent = activePitcher.name;
                document.getElementById('trackerPitcherName').textContent = activePitcher.name;
            }
        };

        window.onPitcherChange = function() {
            const select = document.getElementById('pitcherSelect');
            window.currentPitcherId = select.value;
            renderPitcherDropdown();
            updateDashboard();
            updateTrackerCounters();
        };

        window.openDeletePitcherModal = function() {
            if (!window.currentPitcherId) return;
            const activePitcher = window.pitchers.find(p => p.id === window.currentPitcherId);
            if (!activePitcher) return;
            document.getElementById('deletePitcherTargetName').textContent = `${activePitcher.name} ${activePitcher.number ? `(#${activePitcher.number})` : ''}`;
            document.getElementById('deletePitcherModal').classList.remove('hidden');
        };

        window.closeDeletePitcherModal = function() {
            document.getElementById('deletePitcherModal').classList.add('hidden');
        };

        window.confirmDeletePitcher = async function() {
            const targetId = window.currentPitcherId;
            if (!targetId) return;

            const confirmBtn = document.getElementById('confirmDeletePitcherBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = '削除中...';

            const relatedPitches = window.pitches.filter(p => p.pitcherId === targetId);

            try {
                if (db) {
                    // Delete related pitch records first
                    for (const p of relatedPitches) {
                        if (p.id) {
                            try {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pitches', p.id));
                            } catch (e) {}
                        }
                    }
                    // Delete the pitcher document itself
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pitchers', targetId));
                } else {
                    window.pitches = window.pitches.filter(p => p.pitcherId !== targetId);
                    window.pitchers = window.pitchers.filter(p => p.id !== targetId);
                }
            } catch (e) {
                console.error("Delete pitcher error:", e);
            }

            window.currentPitcherId = window.pitchers.find(p => p.id !== targetId)?.id || null;

            confirmBtn.disabled = false;
            confirmBtn.textContent = '削除する';
            closeDeletePitcherModal();
            renderPitcherDropdown();
            updateDashboard();
            updateTrackerCounters();
        };

        window.setPeriodFilter = function(period) {
            window.currentFilter.period = period;
            window.currentFilter.month = null;
            window.currentFilter.date = null;

            document.getElementById('monthPicker').value = '';
            document.getElementById('datePicker').value = '';

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn bg-slate-100 text-slate-600 text-xs font-bold py-2 px-1 rounded-xl transition text-center hover:bg-slate-200';
            });

            if (period === 'all') {
                document.getElementById('btnFilterAll').className = 'filter-btn bg-indigo-600 text-white text-xs font-bold py-2 px-1 rounded-xl transition text-center shadow-sm';
            } else if (period === 'month') {
                document.getElementById('btnFilterMonth').className = 'filter-btn bg-indigo-600 text-white text-xs font-bold py-2 px-1 rounded-xl transition text-center shadow-sm';
            } else if (period === 'today') {
                document.getElementById('btnFilterToday').className = 'filter-btn bg-indigo-600 text-white text-xs font-bold py-2 px-1 rounded-xl transition text-center shadow-sm';
            }

            updateDashboard();
        };

        window.onCustomDateChange = function(type) {
            if (type === 'month') {
                const val = document.getElementById('monthPicker').value;
                if (val) {
                    window.currentFilter.period = 'customMonth';
                    window.currentFilter.month = val;
                    window.currentFilter.date = null;
                    document.getElementById('datePicker').value = '';
                }
            } else if (type === 'date') {
                const val = document.getElementById('datePicker').value;
                if (val) {
                    window.currentFilter.period = 'customDate';
                    window.currentFilter.date = val;
                    window.currentFilter.month = null;
                    document.getElementById('monthPicker').value = '';
                }
            }
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = 'filter-btn bg-slate-100 text-slate-600 text-xs font-bold py-2 px-1 rounded-xl transition text-center hover:bg-slate-200';
            });
            updateDashboard();
        };

        window.resetFilters = function() {
            setPeriodFilter('all');
        };

        window.getFilteredPitches = function() {
            if (!window.currentPitcherId) return [];

            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];
            const currentMonthStr = todayStr.substring(0, 7);

            return window.pitches.filter(p => {
                if (p.pitcherId !== window.currentPitcherId) return false;

                if (window.currentFilter.period === 'today') {
                    return p.date === todayStr;
                } else if (window.currentFilter.period === 'month') {
                    return p.date && p.date.startsWith(currentMonthStr);
                } else if (window.currentFilter.period === 'customMonth') {
                    return p.date && p.date.startsWith(window.currentFilter.month);
                } else if (window.currentFilter.period === 'customDate') {
                    return p.date === window.currentFilter.date;
                }
                return true;
            });
        };

        window.updateDashboard = function() {
            const filteredPitches = getFilteredPitches();
            const total = filteredPitches.length;
            const strikes = filteredPitches.filter(p => p.result === 'strike').length;
            const balls = filteredPitches.filter(p => p.result === 'ball').length;

            const strikeRate = total > 0 ? ((strikes / total) * 100).toFixed(1) : '0.0';
            const ballRate = total > 0 ? ((balls / total) * 100).toFixed(1) : '0.0';

            let periodText = '全期間';
            if (window.currentFilter.period === 'today') periodText = '本日';
            if (window.currentFilter.period === 'month') periodText = '今月';
            if (window.currentFilter.period === 'customMonth') periodText = `${window.currentFilter.month}月`;
            if (window.currentFilter.period === 'customDate') periodText = `${window.currentFilter.date}`;
            document.getElementById('statsPeriodLabel').textContent = `集計期間: ${periodText}`;

            document.getElementById('totalPitchCountBadge').textContent = `${total} 投球`;
            document.getElementById('chartCenterRate').textContent = `${strikeRate}%`;
            document.getElementById('strikeCountText').textContent = `${strikes} 球`;
            document.getElementById('strikePercentText').textContent = `${strikeRate}%`;
            document.getElementById('ballCountText').textContent = `${balls} 球`;
            document.getElementById('ballPercentText').textContent = `${ballRate}%`;

            if (window.chartInstance) {
                window.chartInstance.data.datasets[0].data = total > 0 ? [strikes, balls] : [0, 0];
                window.chartInstance.update();
            }

            renderPitchTypeBreakdown(filteredPitches);
            renderPitchHistoryList(filteredPitches);
        };

        function renderPitchTypeBreakdown(filteredPitches) {
            const container = document.getElementById('pitchTypeBreakdown');
            container.innerHTML = '';

            if (filteredPitches.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">該当する投球データがありません</p>';
                return;
            }

            PITCH_TYPES.forEach(pt => {
                const ptPitches = filteredPitches.filter(p => p.pitchType === pt.id);
                if (ptPitches.length === 0) return;

                const ptTotal = ptPitches.length;
                const ptStrikes = ptPitches.filter(p => p.result === 'strike').length;
                const ptRate = ((ptStrikes / ptTotal) * 100).toFixed(0);

                const div = document.createElement('div');
                div.className = 'space-y-1';
                div.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-700">${pt.name} <span class="text-slate-400 font-normal">(${ptTotal}球)</span></span>
                        <span class="font-extrabold ${ptRate >= 65 ? 'text-red-600' : 'text-slate-700'}">${ptRate}% S</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden flex">
                        <div class="bg-red-500 h-full transition-all duration-300" style="width: ${ptRate}%"></div>
                        <div class="bg-blue-400 h-full transition-all duration-300" style="width: ${100 - ptRate}%"></div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function renderPitchHistoryList(filteredPitches) {
            const container = document.getElementById('pitchHistoryList');
            container.innerHTML = '';

            if (filteredPitches.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-2">履歴がありません</p>';
                return;
            }

            const recent = [...filteredPitches].sort((a,b) => b.timestamp - a.timestamp).slice(0, 15);

            recent.forEach(p => {
                const pt = PITCH_TYPES.find(t => t.id === p.pitchType) || { name: 'その他' };
                const isStrike = p.result === 'strike';

                const div = document.createElement('div');
                div.className = 'flex items-center justify-between bg-slate-50 border border-slate-200/60 rounded-xl px-3 py-2 text-xs';
                div.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${isStrike ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'}">
                            ${isStrike ? 'S' : 'B'}
                        </span>
                        <span class="font-bold text-slate-700">${pt.name}</span>
                        <span class="text-[10px] text-slate-400">${p.date || ''}</span>
                    </div>
                    <button onclick="deletePitch('${p.id}')" class="text-slate-300 hover:text-red-500 p-1">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        // Record pitch to Cloud Storage
        window.recordPitch = async function(result) {
            if (!window.currentPitcherId) {
                const toast = document.getElementById('lastPitchFeedback');
                document.getElementById('lastPitchDetails').textContent = '投手を先に選択/登録してください';
                toast.classList.remove('opacity-0');
                setTimeout(() => toast.classList.add('opacity-0'), 2000);
                return;
            }

            if (navigator.vibrate) navigator.vibrate(40);

            const todayStr = new Date().toISOString().split('T')[0];
            const newPitch = {
                id: 'pitch_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                pitcherId: window.currentPitcherId,
                pitchType: window.selectedPitchType,
                result: result,
                date: todayStr,
                timestamp: Date.now()
            };

            if (db) {
                try {
                    const pitchesCol = collection(db, 'artifacts', appId, 'public', 'data', 'pitches');
                    await addDoc(pitchesCol, {
                        pitcherId: newPitch.pitcherId,
                        pitchType: newPitch.pitchType,
                        result: newPitch.result,
                        date: newPitch.date,
                        timestamp: newPitch.timestamp
                    });
                } catch (err) {
                    console.error("Cloud pitch record error:", err);
                    window.pitches.push(newPitch);
                    updateDashboard();
                    updateTrackerCounters();
                }
            } else {
                window.pitches.push(newPitch);
                updateDashboard();
                updateTrackerCounters();
            }

            const ptName = PITCH_TYPES.find(t => t.id === window.selectedPitchType)?.name || '';
            const resText = result === 'strike' ? 'ストライク' : 'ボール';
            const detailsText = `${ptName} (${resText})`;

            const toast = document.getElementById('lastPitchFeedback');
            document.getElementById('lastPitchDetails').textContent = detailsText;
            toast.classList.remove('opacity-0');
            setTimeout(() => toast.classList.add('opacity-0'), 1800);
        };

        window.undoLastPitch = async function() {
            if (!window.currentPitcherId) return;

            const pitcherPitches = window.pitches.filter(p => p.pitcherId === window.currentPitcherId);
            if (pitcherPitches.length === 0) return;

            const lastPitch = pitcherPitches.sort((a,b) => b.timestamp - a.timestamp)[0];

            if (db && lastPitch.id) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pitches', lastPitch.id));
                } catch (err) {
                    window.pitches = window.pitches.filter(p => p.id !== lastPitch.id);
                    updateDashboard();
                    updateTrackerCounters();
                }
            } else {
                window.pitches = window.pitches.filter(p => p.id !== lastPitch.id);
                updateDashboard();
                updateTrackerCounters();
            }

            if (navigator.vibrate) navigator.vibrate([20, 30, 20]);
        };

        window.deletePitch = async function(pitchId) {
            if (db && pitchId) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pitches', pitchId));
                } catch (err) {
                    window.pitches = window.pitches.filter(p => p.id !== pitchId);
                    updateDashboard();
                    updateTrackerCounters();
                }
            } else {
                window.pitches = window.pitches.filter(p => p.id !== pitchId);
                updateDashboard();
                updateTrackerCounters();
            }
        };

        window.clearCurrentFilteredHistory = async function() {
            const filtered = getFilteredPitches();
            if (filtered.length === 0) return;

            if (db) {
                for (const p of filtered) {
                    if (p.id) {
                        try {
                            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pitches', p.id));
                        } catch (e) {}
                    }
                }
            }
            const idsToRemove = new Set(filtered.map(p => p.id));
            window.pitches = window.pitches.filter(p => !idsToRemove.has(p.id));
            updateDashboard();
            updateTrackerCounters();
        };

        window.updateTrackerCounters = function() {
            const todayStr = new Date().toISOString().split('T')[0];
            const todayPitches = window.pitches.filter(p => p.pitcherId === window.currentPitcherId && p.date === todayStr);

            const total = todayPitches.length;
            const strikes = todayPitches.filter(p => p.result === 'strike').length;
            const balls = todayPitches.filter(p => p.result === 'ball').length;

            document.getElementById('sessionTotalCount').textContent = total;
            document.getElementById('sessionStrikeCount').textContent = strikes;
            document.getElementById('sessionBallCount').textContent = balls;
        };

        // Finish Session Flow
        window.finishSession = function() {
            if (!window.currentPitcherId) return;

            const activePitcher = window.pitchers.find(p => p.id === window.currentPitcherId);
            const todayStr = new Date().toISOString().split('T')[0];
            const todayPitches = window.pitches.filter(p => p.pitcherId === window.currentPitcherId && p.date === todayStr);

            const total = todayPitches.length;
            const strikes = todayPitches.filter(p => p.result === 'strike').length;
            const balls = todayPitches.filter(p => p.result === 'ball').length;
            const strikeRate = total > 0 ? ((strikes / total) * 100).toFixed(1) : '0.0';
            const ballRate = total > 0 ? ((balls / total) * 100).toFixed(1) : '0.0';

            document.getElementById('summaryPitcherName').textContent = activePitcher ? `${activePitcher.name} 投手` : '';
            document.getElementById('summaryTotalPitch').childNodes[0].nodeValue = `${total} `;
            document.getElementById('summaryStrikeCount').textContent = `${strikes} 球`;
            document.getElementById('summaryStrikeRate').textContent = `${strikeRate}%`;
            document.getElementById('summaryBallCount').textContent = `${balls} 球`;
            document.getElementById('summaryBallRate').textContent = `${ballRate}%`;

            document.getElementById('finishSessionModal').classList.remove('hidden');
        };

        window.closeFinishSessionModal = function() {
            document.getElementById('finishSessionModal').classList.add('hidden');
            switchView('dashboard');
        };

        window.switchView = function(viewName) {
            const dashView = document.getElementById('viewDashboard');
            const trackView = document.getElementById('viewTracker');
            const navDashBtn = document.getElementById('navDashboardBtn');
            const navTrackBtn = document.getElementById('navTrackerBtn');

            if (viewName === 'dashboard') {
                dashView.classList.remove('hidden');
                trackView.classList.add('hidden');
                navDashBtn.className = 'flex flex-col items-center justify-center text-indigo-600 font-bold transition';
                navTrackBtn.className = 'flex flex-col items-center justify-center text-slate-400 font-bold hover:text-indigo-600 transition';
                updateDashboard();
            } else {
                dashView.classList.add('hidden');
                trackView.classList.remove('hidden');
                navDashBtn.className = 'flex flex-col items-center justify-center text-slate-400 font-bold hover:text-indigo-600 transition';
                navTrackBtn.className = 'flex flex-col items-center justify-center text-indigo-600 font-bold transition';
                updateTrackerCounters();
            }
        };

        window.openAddPitcherModal = function() {
            document.getElementById('addPitcherModal').classList.remove('hidden');
            document.getElementById('newPitcherName').focus();
        };

        window.closeAddPitcherModal = function() {
            document.getElementById('addPitcherModal').classList.add('hidden');
            document.getElementById('newPitcherName').value = '';
            document.getElementById('newPitcherNumber').value = '';
        };

        window.handleAddPitcher = async function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('newPitcherName');
            const numberInput = document.getElementById('newPitcherNumber');
            const name = nameInput.value.trim();
            const number = numberInput.value.trim();

            if (!name) return;

            const newPitcher = {
                id: 'pitcher_' + Date.now(),
                name: name,
                number: number,
                createdAt: Date.now()
            };

            if (db) {
                try {
                    const pitchersCol = collection(db, 'artifacts', appId, 'public', 'data', 'pitchers');
                    const docRef = await addDoc(pitchersCol, {
                        name: newPitcher.name,
                        number: newPitcher.number,
                        createdAt: newPitcher.createdAt
                    });
                    window.currentPitcherId = docRef.id;
                } catch (err) {
                    console.error("Error saving pitcher to DB:", err);
                    window.pitchers.push(newPitcher);
                    window.currentPitcherId = newPitcher.id;
                }
            } else {
                window.pitchers.push(newPitcher);
                window.currentPitcherId = newPitcher.id;
            }

            renderPitcherDropdown();
            updateDashboard();
            updateTrackerCounters();
            closeAddPitcherModal();
        };
    </script>
</body>
</html>
